name: PR201 macOS

on:
  push:
    branches:
      - ci/pr201-macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-media-contracts:
    name: WebKit media contracts
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install WebKit
        working-directory: frontend
        run: npx playwright install webkit
      - name: Run WebKit media contracts
        working-directory: frontend
        run: |
          set -o pipefail
          npm run test:e2e -- --project=webkit-media 2>&1 | tee "$RUNNER_TEMP/webkit.log"
      - name: Report result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/webkit.log" ]; then
            grep -E '([0-9]+ (passed|failed|flaky|skipped))|Error:|✘' "$RUNNER_TEMP/webkit.log" | tail -n 20 | while IFS= read -r line; do echo "::notice::$line"; done
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr201-webkit-media-failure
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
