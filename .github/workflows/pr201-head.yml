name: PR201 head checks

# Test-only workflow on the fork branch ci/pr201-head-eed9701. Never part of PR #201.

on:
  push:
    branches:
      - ci/pr201-head-eed9701
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: typecheck lint vitest build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: checks
        working-directory: frontend
        shell: bash
        run: |
          set -u
          overall=0
          for step in typecheck lint test:coverage build; do
            log="$RUNNER_TEMP/${step//:/_}.log"
            npm run "$step" > "$log" 2>&1
            status=$?
            cat "$log"
            kind=notice; [ "$status" -ne 0 ] && kind=error
            if [ "$step" = "test:coverage" ]; then
              excerpt=$(grep -E 'FAIL|Test Files|Tests |AssertionError|Expected|Received|drive-path' "$log" | head -60)
            else
              excerpt=$(tail -c 5000 "$log")
            fi
            body=$(printf '%s' "$excerpt" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::${kind} title=${step} exit ${status}::${body}"
            [ "$status" -ne 0 ] && overall=1
          done
          exit $overall

  e2e:
    name: playwright chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: install chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: frontend
        shell: bash
        run: |
          set -u
          log="$RUNNER_TEMP/e2e.log"
          npm run test:e2e -- --project=chromium --reporter=line > "$log" 2>&1
          status=$?
          cat "$log"
          kind=notice; [ "$status" -ne 0 ] && kind=error
          body=$(grep -v '^\[[0-9]*/[0-9]*\]' "$log" | tail -c 5000 | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::${kind} title=e2e chromium exit ${status}::${body}"
          exit $status
