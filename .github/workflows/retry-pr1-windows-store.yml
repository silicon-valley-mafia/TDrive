name: Retry PR 1 Windows Store sideload job

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: retry-pr-1-windows-store
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PR and retry the target CI job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$GH_REPO/pulls/1")"
          state="$(jq -r '.state' <<<"$pr")"
          merged="$(jq -r '.merged' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"

          if [[ "$state" != "open" || "$merged" == "true" ]]; then
            echo "PR #1 is closed or merged; no retry."
            exit 0
          fi
          if [[ "$draft" == "true" ]]; then
            echo "PR #1 is a draft; the target job is intentionally gated."
            exit 0
          fi

          # Find the newest CI run associated with PR #1 and its current head.
          runs="$(gh api "repos/$GH_REPO/actions/runs?event=pull_request&per_page=100")"
          run_id="$(jq -r --arg sha "$head_sha" --arg ref "$head_ref" '
            [.workflow_runs[]
             | select(.name == "CI")
             | select(any(.pull_requests[]?; .number == 1))
             | select(.head_sha == $sha or .head_branch == $ref)]
            | sort_by(.created_at)
            | last
            | .id // empty
          ' <<<"$runs")"

          if [[ -z "$run_id" ]]; then
            echo "No matching CI run found for PR #1 head $head_sha."
            exit 0
          fi

          run="$(gh api "repos/$GH_REPO/actions/runs/$run_id")"
          run_status="$(jq -r '.status' <<<"$run")"
          run_conclusion="$(jq -r '.conclusion // ""' <<<"$run")"

          if [[ "$run_status" != "completed" ]]; then
            echo "CI run $run_id is $run_status; wait for it to finish."
            exit 0
          fi

          jobs="$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100")"
          target="$(jq -c '[.jobs[] | select(.name == "Windows Store sideload package")] | first // empty' <<<"$jobs")"

          if [[ -z "$target" ]]; then
            echo "Target job is absent from run $run_id; no retry."
            exit 0
          fi

          job_status="$(jq -r '.status' <<<"$target")"
          job_conclusion="$(jq -r '.conclusion // ""' <<<"$target")"
          job_id="$(jq -r '.id' <<<"$target")"

          if [[ "$job_conclusion" == "success" ]]; then
            echo "Windows Store sideload package succeeded in run $run_id."
            exit 0
          fi
          if [[ "$job_status" != "completed" ]]; then
            echo "Target job is $job_status; wait."
            exit 0
          fi

          if [[ "$job_conclusion" == "failure" ]]; then
            echo "Retrying failed jobs in CI run $run_id (target job $job_id)."
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/rerun-failed-jobs"
          elif [[ "$job_conclusion" == "skipped" ]]; then
            echo "Target job was skipped in completed run $run_id. Rerunning the workflow to re-evaluate its dependency chain and regenerate required artifacts."
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/rerun"
          else
            echo "Target job conclusion is '$job_conclusion'; rerunning the workflow to retry the target."
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/rerun"
          fi
